summary = "xPlorer"
description = """xPlorer 透過 NVDA 讓檔案總管更快。多擊快速鍵可複製名稱、文字或路徑、依副檔名或搜尋來選取、反向與多重選取、壓縮與解壓縮、執行 Robocopy 與批次重新命名。此外還有：檔案籃、工作區、最近的位置、平面檢視、資料夾比較、重複項目尋找器、資料夾轉 ISO、冷凍庫（保護項目免於刪除、重新命名與剪下）以及資料夾大小清單，並在瀏覽時朗讀項目大小

熱鍵：
NVDA+Shift+C
單擊：複製所選的檔案和資料夾名稱到剪貼簿
雙指輕觸：複製所選檔案的文字內容
三連擊：複製目前資料件夾的網址列路徑

NVDA+Shift+V
單擊：選取所有與焦點項目副檔名相同的其他項目
雙擊：反向選取
三按：切換多重選取模式（使用鍵盤進行不連續選取）

NVDA+Shift+A
單擊：開啟「透過搜尋選擇」對話框
雙擊：開啟平鋪檢視
三擊：開啟批次重新命名工具

NVDA+Shift+Z
單擊：朗報目前選取範圍的總大小
雙擊：將選取範圍壓縮為 zip 檔案
三連擊：解壓縮所選的壓縮檔

NVDA+Shift+R
單擊：Robocopy - 標記要複製的選取項目
雙擊：Robocopy - 貼上至目前資料夾
三擊：Robocopy - 標記要移動的選取項目

NVDA+Shift+X
單擊：開啟主要 xPlorer 右鍵功能表
雙擊：開啟最近位置功能表
三擊：目前資料夾大小清單

NVDA+Shift+F2
單擊：重新命名選取的檔案
雙擊：使用目前的剪貼簿文字重新命名選取的檔案或資料夾
三擊：復原上一個批次重新命名作業

NVDA+Shift+N
單擊：將選取的項目新增至檔案籃
雙擊：開啟檔案籃視窗
三擊：清除檔案籃

NVDA+Shift+M
單擊：開啟工作區功能表
雙擊：將選取的資料夾新增至新工作區，或將目前的資料夾儲存為工作區
三擊：開啟工作區編輯器（重新命名、釘選、重新排序或刪除已儲存的工作區）

NVDA+Shift+K
單擊：凍結選取的檔案與資料夾（無法刪除、重新命名或剪下）
雙擊：解凍選取的檔案與資料夾
三擊：開啟凍結清單（解凍選取項目或全部解凍）

Control+Shift+N：自動將剪貼簿內容貼上至重新命名欄位
ALT+Enter：內容"""